services:
  - type: web
    name: cloudguard-soc
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEMO_MODE
        value: "true"
      - key: AWS_DEFAULT_REGION
        value: us-east-1
      - key: SECRET_KEY
        generateValue: true

